<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Walk 128 — スプライトスタッキング・ボクセルワールド</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-layout">
    <main class="viewport-pane">
      <header class="hud-bar">
        <div class="hud-left">
          <h1 class="app-title">VOXEL WALK <span class="badge">WebGL2 · 128×128</span></h1>
          <div class="stat-group">
            <div class="stat">
              <span class="stat-label">FPS</span>
              <span id="hud-fps" class="stat-value">60 fps</span>
            </div>
            <div class="stat">
              <span class="stat-label">時刻</span>
              <span id="hud-time" class="stat-value">05:30 (朝)</span>
            </div>
            <div class="stat">
              <span class="stat-label">POS</span>
              <span id="hud-pos" class="stat-value">60.5, 64.5, 5.0</span>
            </div>
            <div class="stat">
              <span class="stat-label">足元</span>
              <span id="hud-ground" class="stat-value">草ブロック</span>
            </div>
            <div class="stat">
              <span class="stat-label">地帯</span>
              <span id="hud-biome" class="stat-value">森の渓谷</span>
            </div>
          </div>
        </div>
        <div class="hud-actions">
          <button id="btn-place-torch-hud" class="btn btn-torch" title="現在位置に松明を置く (F)">🔥 松明 (F)</button>
          <button id="btn-reset-pos" class="btn btn-secondary" title="初期位置に戻る (R)">初期位置 (R)</button>
          <button id="btn-reset-cam" class="btn btn-primary" title="カメラ角度をリセット">視点リセット</button>
        </div>
      </header>

      <div class="canvas-stage">
        <canvas id="world-canvas"></canvas>
      </div>

      <footer class="controls-bar">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑↓←→</kbd> 歩く</span>
        <span><kbd>Space</kbd> 2段ジャンプ / 泳ぐ</span>
        <span><kbd>クリック</kbd> ブロック破壊</span>
        <span><kbd>F</kbd> 松明を置く</span>
        <span><kbd>X</kbd> 松明を回収</span>
        <span><kbd>Q</kbd> / <kbd>E</kbd> 回転</span>
        <span><kbd>ドラッグ</kbd> 自由視点</span>
        <span><kbd>ホイール</kbd> ズーム</span>
        <span><kbd>R</kbd> 初期位置</span>
      </footer>
    </main>
  </div>

  <script defer src="js/blocks.js"></script>
  <script defer src="js/world.js"></script>
  <script defer src="js/renderer.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
